odroidgoa-uboot-config

setenv stdout serial,vidconsole
setenv stderr serial,vidconsole

lcd init

# ---------------------------------------------------------------------------
# Panel defaults
# ---------------------------------------------------------------------------

if env exist PanelNum
then
    echo "PanelNum already set: ${PanelNum}"
else
    setenv PanelNum 4
fi

if env exist PanelPath
then
    echo "PanelPath already set: ${PanelPath}"
else
    setenv PanelPath "ScreenFiles/Panel ${PanelNum}"
fi

if env exist PanelPathSlash
then
    echo "PanelPathSlash already set: ${PanelPathSlash}"
else
    setenv PanelPathSlash "ScreenFiles/Panel ${PanelNum}/"
fi

setenv Panel ${PanelNum}

# ---------------------------------------------------------------------------
# Theme colors
# ---------------------------------------------------------------------------

setenv C_BG 000000
setenv C_HEADER 202060
setenv C_PANEL 202020
setenv C_PANEL_INNER 000000
setenv C_FOOTER 101010
setenv C_TEXT ffffff
setenv C_DIM 808080
setenv C_NORMAL c0c0c0
setenv C_SELECT_BG ffffff
setenv C_SELECT_TEXT 000000
setenv C_ERROR 600000
setenv C_RED ff0000

# ---------------------------------------------------------------------------
# Static frame
# ---------------------------------------------------------------------------

setenv r36s_draw_frame '
lcd setbg ${C_BG};
lcd clear;

r36s_rect 0 0 640 54 ${C_HEADER};
lcd setfg ${C_TEXT};
lcd setbg ${C_HEADER};
lcd setcur 24 18;
lcd putstr "R36S Boot Menu";

r36s_rect 32 80 576 320 ${C_PANEL};
r36s_rect 36 84 568 312 ${C_PANEL_INNER};

r36s_rect 0 432 640 48 ${C_FOOTER};
lcd setfg ${C_DIM};
lcd setbg ${C_FOOTER};
lcd setcur 24 448;
lcd putstr "UP/DOWN move   A select   B power"
'

# ---------------------------------------------------------------------------
# Individual row drawing
# row 0 = Boot Linux
# row 1 = Power Off
# ---------------------------------------------------------------------------

setenv r36s_draw_row0_normal '
r36s_rect 56 122 528 36 ${C_PANEL_INNER};
lcd setfg ${C_NORMAL};
lcd setbg ${C_PANEL_INNER};
lcd setcur 72 134;
lcd putstr "Boot Linux"
'

setenv r36s_draw_row0_selected '
r36s_rect 56 122 528 36 ${C_SELECT_BG};
lcd setfg ${C_SELECT_TEXT};
lcd setbg ${C_SELECT_BG};
lcd setcur 72 134;
lcd putstr "Boot Linux"
'

setenv r36s_draw_row1_normal '
r36s_rect 56 172 528 36 ${C_PANEL_INNER};
lcd setfg ${C_NORMAL};
lcd setbg ${C_PANEL_INNER};
lcd setcur 72 184;
lcd putstr "Power Off"
'

setenv r36s_draw_row1_selected '
r36s_rect 56 172 528 36 ${C_SELECT_BG};
lcd setfg ${C_SELECT_TEXT};
lcd setbg ${C_SELECT_BG};
lcd setcur 72 184;
lcd putstr "Power Off"
'

setenv r36s_draw_disabled_rows '
r36s_rect 56 222 528 36 ${C_PANEL_INNER};
lcd setfg ${C_DIM};
lcd setbg ${C_PANEL_INNER};
lcd setcur 72 234;
lcd putstr "Recovery later";

r36s_rect 56 272 528 36 ${C_PANEL_INNER};
lcd setfg ${C_DIM};
lcd setbg ${C_PANEL_INNER};
lcd setcur 72 284;
lcd putstr "Tools later"
'

setenv r36s_draw_initial_menu '
run r36s_draw_frame;
run r36s_draw_row0_selected;
run r36s_draw_row1_normal;
run r36s_draw_disabled_rows
'

# ---------------------------------------------------------------------------
# Selection update helpers
# Only redraw stale row + new selected row
# ---------------------------------------------------------------------------

setenv r36s_select_0 '
if test "${menu_selected}" = "1"
then
    run r36s_draw_row1_normal;
    run r36s_draw_row0_selected;
    setenv menu_selected 0;
fi
'

setenv r36s_select_1 '
if test "${menu_selected}" = "0"
then
    run r36s_draw_row0_normal;
    run r36s_draw_row1_selected;
    setenv menu_selected 1;
fi
'

# ---------------------------------------------------------------------------
# Status screens
# ---------------------------------------------------------------------------

setenv r36s_draw_booting '
lcd setbg ${C_BG};
lcd clear;
r36s_rect 0 0 640 54 ${C_HEADER};
lcd setfg ${C_TEXT};
lcd setbg ${C_HEADER};
lcd setcur 24 18;
lcd putstr "R36S Boot Menu";
lcd setbg ${C_BG};
lcd setcur 32 96;
lcd putstr "Booting Linux..."
'

setenv r36s_draw_poweroff '
lcd setbg ${C_BG};
lcd clear;
lcd setfg ${C_TEXT};
lcd setbg ${C_BG};
lcd setcur 32 96;
lcd putstr "Powering off..."
'

setenv r36s_draw_bootfail '
lcd setbg ${C_BG};
lcd clear;
r36s_rect 0 0 640 54 ${C_ERROR};
lcd setfg ${C_TEXT};
lcd setbg ${C_ERROR};
lcd setcur 24 18;
lcd putstr "Boot failed";
lcd setfg ${C_RED};
lcd setbg ${C_BG};
lcd setcur 32 96;
lcd putstr "Could not boot Linux";
lcd setfg ${C_DIM};
lcd setcur 32 128;
lcd putstr "Powering off..."
'

# ---------------------------------------------------------------------------
# Actions
# ---------------------------------------------------------------------------

setenv r36s_boot_linux '
run r36s_draw_booting;

setenv dtbo_loadaddr 0x01e00000;
setenv dtb_loadaddr 0x01f00000;
setenv loadaddr 0x02000000;

if load mmc 1:2 ${loadaddr} boot/Image
then
    setexpr initrd_loadaddr ${loadaddr} + ${filesize};
    setexpr initrd_loadaddr ${initrd_loadaddr} + 0x01000000;

    if load mmc 1:2 ${initrd_loadaddr} boot/uInitrd
    then
        if load mmc 1:2 ${dtb_loadaddr} boot/dtb/rockchip/rk3326-gameconsole-r36s.dtb
        then
            if load mmc 1:1 ${dtbo_loadaddr} "${PanelPath}/mipi-panel.dtbo"
            then
                fdt addr ${dtb_loadaddr};
                fdt resize 8192;
                fdt apply ${dtbo_loadaddr};

                setenv bootargs "root=LABEL=armbian rootwait rw fbcon=rotate:0 quiet splash consoleblank=0 plymouth.ignore-serial-consoles console=ttyS2,115200 console=tty0";
                setenv bootargs "${bootargs} panel=${PanelNum} PanelNum=${PanelNum}";

                booti ${loadaddr} ${initrd_loadaddr} ${dtb_loadaddr};
            fi;
        fi;
    fi;
fi;

run r36s_draw_bootfail;
sleep 5;
poweroff
'

setenv r36s_poweroff '
run r36s_draw_poweroff;
sleep 1;
poweroff
'

setenv r36s_select_current '
if test "${menu_selected}" = "0"
then
    run r36s_boot_linux
else
    run r36s_poweroff
fi
'

# ---------------------------------------------------------------------------
# Main loop
# ---------------------------------------------------------------------------

setenv menu_selected 0
run r36s_draw_initial_menu

while test 1 = 1
do
    r36s_waitkey menu_key

    if test "${menu_key}" = "u"
    then
        run r36s_select_0
    elif test "${menu_key}" = "d"
    then
        run r36s_select_1
    elif test "${menu_key}" = "a"
    then
        run r36s_select_current
    elif test "${menu_key}" = "b"
    then
        run r36s_poweroff
    fi
done
